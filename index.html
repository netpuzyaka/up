<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Up Bot — Панель управления</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --panel2: #1c2330;
    --border: #2b3240;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #2ea043;
    --green-bg: rgba(46, 160, 67, .15);
    --red: #f85149;
    --red-bg: rgba(248, 81, 73, .15);
    --blue: #4493f8;
    --accent: #6e40c9;
    --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .btn.danger { border-color: var(--red); color: var(--red); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
  }
  .card h3 { font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
  .big { font-size: 28px; font-weight: 700; }
  .ok-color { color: var(--green); }
  .fail-color { color: var(--red); }
  .section-title { font-size: 16px; font-weight: 700; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; }
  .server-card { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .server-name { font-size: 20px; font-weight: 700; }
  .mono { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .progress { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; display: flex; margin-top: 8px; }
  .progress .ok-bar { background: var(--green); }
  .progress .fail-bar { background: var(--red); }
  .stat-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 4px; gap: 8px; }
  .channel-name { font-size: 15px; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .badge-ok { background: var(--green-bg); color: var(--green); }
  .badge-fail { background: var(--red-bg); color: var(--red); }
  .badge-active { background: var(--green-bg); color: var(--green); }
  .badge-inactive { background: var(--red-bg); color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .account-card { display: flex; flex-direction: column; gap: 6px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    color: #fff; font-size: 15px; flex-shrink: 0;
  }
  .acc-head { display: flex; align-items: center; gap: 10px; }
  .error-msg {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; text-align: center; color: var(--muted);
  }
  .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .dot-on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot-off { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .input, textarea, select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-size: 13px; font-family: inherit;
  }
  textarea { min-height: 110px; resize: vertical; font-family: Consolas, monospace; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px;
    font-size: 13px; max-width: 380px; z-index: 99; display: none;
  }
  .toast.ok { border-color: var(--green); display: block; }
  .toast.err { border-color: var(--red); display: block; }
  @media (max-width: 600px) { body { padding: 12px; } .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>⬆️ Up Bot — Панель управления</h1>
      <div class="sub" id="updated">Загрузка данных...</div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <span id="botStatus" class="sub" style="margin:0">Проверка бота...</span>
      <button class="btn" onclick="load()">🔄 Обновить</button>
    </div>
  </div>

  <div class="section-title">⚙️ Настройки бота</div>
  <div class="card">
    <div class="row2">
      <div>
        <div class="field">
          <label>Ссылки на темы (каналы) — по одной в строке (ссылка или ID)</label>
          <textarea id="channels"></textarea>
        </div>
      </div>
      <div>
        <div class="field">
          <label>Текст сообщения</label>
          <input class="input" id="message" type="text" placeholder="up">
        </div>
        <div class="field">
          <label>Интервал между отправками (минут)</label>
          <input class="input" id="interval" type="number" min="1" max="10080" placeholder="720">
        </div>
        <div class="field">
          <label>Код инвайта (без discord.gg/)</label>
          <input class="input" id="invite" type="text" placeholder="AYnkWUBwy">
        </div>
        <div class="field">
          <label>Тип токена</label>
          <select class="input" id="useBot">
            <option value="false">Пользовательские токены</option>
            <option value="true">Токены ботов</option>
          </select>
        </div>
        <div class="actions">
          <button class="btn primary" onclick="saveSettings()">💾 Сохранить настройки</button>
          <button class="btn danger" onclick="stopBot()">⏹ Остановить бота</button>
        </div>
        <div class="stat-line" style="margin-top:12px"><span id="settingsNote"></span></div>
      </div>
    </div>
  </div>

  <div class="section-title">🔑 Токены</div>
  <div class="card">
    <div class="row2">
      <div>
        <div class="field">
          <label>Discord-токены (по одному в строке)</label>
          <textarea id="tokens"></textarea>
        </div>
        <div class="actions">
          <button class="btn primary" onclick="saveTokens()">💾 Сохранить токены</button>
          <a class="btn" id="downloadLink" href="#" download="tokens.txt">⬇️ Скачать tokens.txt</a>
          <label class="btn" style="cursor:pointer">📁 Загрузить файл<input type="file" id="tokenFile" accept=".txt" style="display:none" onchange="uploadTokensFile(this)"></label>
        </div>
      </div>
      <div>
        <div class="field">
          <label>GitHub токен (для отправки статистики на сайт)</label>
          <input class="input" id="githubToken" type="password" placeholder="не задан" autocomplete="off">
        </div>
        <div class="stat-line"><span id="githubStatus">—</span></div>
        <div class="actions">
          <button class="btn primary" onclick="saveGithubToken()">💾 Сохранить GitHub токен</button>
        </div>
        <div class="stat-line" style="margin-top:12px"><span>Файл с токенами (txt, по одному в строке) можно выбрать — он сразу загрузится в бота.</span></div>
      </div>
    </div>
  </div>

  <div id="content"></div>

  <div class="toast" id="toast"></div>

<script>
const LOCAL = 'http://127.0.0.1:8787';
const DATA_URL = 'https://raw.githubusercontent.com/netpuzyaka/up/main/data/stats.json';
const SETTINGS_URL = 'https://raw.githubusercontent.com/netpuzyaka/up/main/data/settings.json';
let localAvailable = false;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  setTimeout(() => t.className = 'toast', 4000);
}

async function fetchLocal(path, timeoutMs = 2000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const resp = await fetch(LOCAL + path, { signal: ctrl.signal });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.json();
  } finally {
    clearTimeout(timer);
  }
}

async function checkLocal() {
  try {
    await fetchLocal('/api/status', 1500);
    localAvailable = true;
    document.getElementById('botStatus').innerHTML = '<span class="status-dot dot-on"></span>Бот запущен';
  } catch {
    localAvailable = false;
    document.getElementById('botStatus').innerHTML = '<span class="status-dot dot-off"></span>Бот не запущен (просмотр из GitHub)';
  }
}

async function loadSettings() {
  let s = null;
  if (localAvailable) {
    try { s = await fetchLocal('/api/settings'); }
    catch { s = null; }
  }
  if (!s) {
    try {
      const resp = await fetch(SETTINGS_URL, { cache: 'no-store' });
      if (resp.ok) s = await resp.json();
    } catch {}
  }
  document.getElementById('channels').value = (s && s.channels ? s.channels : []).join('\n');
  document.getElementById('message').value = (s && s.message) || 'up';
  document.getElementById('interval').value = (s && s.intervalMinutes) || 720;
  document.getElementById('invite').value = (s && s.invite) || 'AYnkWUBwy';
  document.getElementById('useBot').value = String(!!(s && s.useBot));
  document.getElementById('settingsNote').textContent = localAvailable
    ? 'Настройки сохраняются в бота напрямую.'
    : 'Локальный бот недоступен — сохранить настройки нельзя. Запустите бота на этом ПК.';
}

async function saveSettings() {
  if (!localAvailable) {
    toast('Бот не запущен на этом ПК — сохранить нельзя. Запустите бота и обновите страницу.', false);
    return;
  }
  const payload = {
    intervalMinutes: parseInt(document.getElementById('interval').value) || 720,
    message: document.getElementById('message').value.trim() || 'up',
    invite: document.getElementById('invite').value.trim() || 'AYnkWUBwy',
    useBot: document.getElementById('useBot').value === 'true',
    channels: document.getElementById('channels').value.split('\n').map(s => s.trim()).filter(s => s)
  };
  try {
    const resp = await fetch(LOCAL + '/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    toast('✅ Настройки сохранены и применены.', true);
    load();
  } catch (e) {
    toast('❌ Ошибка сохранения: ' + e.message, false);
  }
}

async function stopBot() {
  if (!localAvailable) { toast('Бот не запущен.', false); return; }
  if (!confirm('Остановить бота?')) return;
  try {
    await fetch(LOCAL + '/api/stop', { method: 'POST' });
    toast('Бот остановлен.', true);
  } catch (e) {
    toast('Ошибка: ' + e.message, false);
  }
}

async function loadTokens() {
  document.getElementById('downloadLink').href = LOCAL + '/api/tokens/download';
  if (!localAvailable) { return; }
  try {
    const data = await fetchLocal('/api/tokens');
    document.getElementById('tokens').value = (data.tokens || []).join('\n');
  } catch {}
}

async function loadGithub() {
  if (!localAvailable) { document.getElementById('githubStatus').textContent = '—'; return; }
  try {
    const g = await fetchLocal('/api/github');
    document.getElementById('githubStatus').textContent = g.set ? ('Задан: ' + g.masked) : 'не задан';
  } catch {
    document.getElementById('githubStatus').textContent = '—';
  }
}

async function saveTokens() {
  if (!localAvailable) { toast('Бот не запущен на этом ПК — сохранить нельзя.', false); return; }
  const tokens = document.getElementById('tokens').value.split('\n').map(s => s.trim()).filter(s => s);
  try {
    const resp = await fetch(LOCAL + '/api/tokens', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tokens })
    });
    const res = await resp.json();
    if (!resp.ok) throw new Error(res.error || ('HTTP ' + resp.status));
    toast(`✅ Токенов: ${res.total}, добавлено новых: ${res.added}, ошибок: ${res.failedCount}`, true);
    loadTokens();
    load();
  } catch (e) {
    toast('❌ ' + e.message, false);
  }
}

async function uploadTokensFile(input) {
  const file = input.files[0];
  if (!file) return;
  const text = await file.text();
  document.getElementById('tokens').value = text;
  await saveTokens();
  input.value = '';
}

async function saveGithubToken() {
  if (!localAvailable) { toast('Бот не запущен на этом ПК — сохранить нельзя.', false); return; }
  const token = document.getElementById('githubToken').value.trim();
  if (!token) { toast('Введите токен.', false); return; }
  try {
    const resp = await fetch(LOCAL + '/api/github', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    document.getElementById('githubToken').value = '';
    toast('✅ GitHub токен сохранён.', true);
    loadGithub();
  } catch (e) {
    toast('❌ ' + e.message, false);
  }
}

async function load() {
  const el = document.getElementById('content');
  try {
    const resp = await fetch(DATA_URL, { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    render(await resp.json());
  } catch (e) {
    el.innerHTML = '<div class="error-msg">Нет данных. Файл статистики ещё не создан ботом (data/stats.json в репозитории).<br>Запустите бота хотя бы раз с github_token.txt.</div>';
    document.getElementById('updated').textContent = 'Ошибка: ' + e.message;
  }
}

function render(d) {
  const srv = d.server || {};
  const channels = d.channels || [];
  const accounts = d.accounts || [];
  const events = (d.events || []).slice(0, 150);

  const totalSends = channels.reduce((s, c) => s + (c.sends || 0), 0);
  const totalOk = channels.reduce((s, c) => s + (c.ok || 0), 0);
  const totalFail = channels.reduce((s, c) => s + (c.fail || 0), 0);

  document.getElementById('updated').textContent = 'Обновлено: ' + (d.updatedAt || '—') + ' · автообновление каждые 60 сек';

  let html = '';

  html += `<div class="card server-card">
    <div class="server-name">🌐 ${esc(srv.name || 'Сервер')}</div>
    <div class="mono">ID: ${esc(srv.id || '—')}</div>
    <div><a href="${esc(srv.invite || '#')}" target="_blank">${esc(srv.invite || '—')}</a></div>
  </div>`;

  html += `<div class="grid">
    <div class="card"><h3>Всего отправок</h3><div class="big">${totalSends}</div></div>
    <div class="card"><h3>Успешно</h3><div class="big ok-color">${totalOk}</div></div>
    <div class="card"><h3>Неудачно</h3><div class="big fail-color">${totalFail}</div></div>
    <div class="card"><h3>Аккаунты</h3><div class="big">${accounts.length}</div></div>
  </div>`;

  html += `<div class="section-title">📢 Темы (каналы), куда отправляются сообщения</div><div class="grid">`;
  for (const c of channels) {
    const ok = c.ok || 0, fail = c.fail || 0, total = ok + fail;
    const pctOk = total ? Math.round(ok / total * 100) : 0;
    html += `<div class="card">
      <div class="channel-name"># ${esc(c.name || c.id)}</div>
      <div class="mono">ID: ${esc(c.id)}</div>
      <div class="progress">
        <div class="ok-bar" style="width:${pctOk}%"></div>
        <div class="fail-bar" style="width:${total ? 100 - pctOk : 0}%"></div>
      </div>
      <div class="stat-line"><span>✅ ${ok} успешно</span><span>❌ ${fail} ошибок</span></div>
      <div class="stat-line"><span>Всего: ${total}</span>
        <span class="badge ${(c.lastResult === 'ok') ? 'badge-ok' : 'badge-fail'}">${(c.lastResult === 'ok') ? 'последняя: успех' : (c.lastResult === 'fail' ? 'последняя: ошибка' : 'нет данных')}</span></div>
      <div class="stat-line"><span>Последняя: ${esc(c.lastTime || '—')}</span></div>
    </div>`;
  }
  html += '</div>';

  html += `<div class="section-title">👤 Discord-аккаунты</div><div class="grid">`;
  for (const a of accounts) {
    const ok = a.ok || 0, fail = a.fail || 0;
    html += `<div class="card">
      <div class="acc-head">
        <div class="avatar">${esc((a.username || '?').slice(0, 1).toUpperCase())}</div>
        <div>
          <div class="channel-name">${esc(a.username || '—')}</div>
          <span class="badge ${a.status === 'active' ? 'badge-active' : 'badge-inactive'}">${a.status === 'active' ? 'активен' : 'неактивен'}</span>
        </div>
      </div>
      <div class="stat-line"><span>Отправок: ${a.sends || 0}</span><span>✅ ${ok} / ❌ ${fail}</span></div>
      <div class="stat-line"><span>Последний канал:</span><span># ${esc(a.lastChannel || '—')}</span></div>
      <div class="stat-line"><span>Последняя отправка:</span><span>${esc(a.lastTime || '—')}</span></div>
    </div>`;
  }
  html += '</div>';

  html += `<div class="section-title">📋 Журнал отправок (последние ${events.length})</div>
  <div class="card" style="overflow-x:auto">
  <table>
    <tr><th>Время</th><th>Аккаунт</th><th>Канал</th><th>Результат</th><th>Ошибка</th></tr>`;
  for (const e of events) {
    html += `<tr>
      <td class="mono">${esc(e.time)}</td>
      <td>${esc(e.account)}</td>
      <td># ${esc(e.channel)}</td>
      <td><span class="badge ${e.ok ? 'badge-ok' : 'badge-fail'}">${e.ok ? '✅ успех' : '❌ ошибка'}</span></td>
      <td class="mono">${esc(e.error || '—')}</td>
    </tr>`;
  }
  html += '</table></div>';

  document.getElementById('content').innerHTML = html;
}

(async function init() {
  await checkLocal();
  await loadSettings();
  await loadTokens();
  await loadGithub();
  load();
})();
setInterval(checkLocal, 15000);
setInterval(load, 60000);
</script>
</body>
</html>
